# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: devclean

before:
  hooks:
    - go mod tidy

builds:
  - id: devclean
    main: ./cmd/devclean
    binary: devclean
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# release-please writes the notes when it creates the Release; goreleaser adds the assets
# and prepends the install header to those notes.
changelog:
  disable: true

release:
  draft: false
  prerelease: auto
  mode: prepend
  # A re-run after a partial upload replaces the assets already on the Release instead of failing.
  replace_existing_artifacts: true
  header: |
    ## devclean {{ .Tag }}

    Install:
    ```bash
    go install github.com/ohing504/devclean/cmd/devclean@{{ .Tag }}
    ```
    Or download a pre-built binary from the assets below and put it on your PATH.
